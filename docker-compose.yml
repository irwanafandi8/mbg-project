services:
  mbg-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbg-app
    restart: always
    networks:
      - duvi-network
    ports:
      - "8080:80"
    volumes:
      - mbg_storage:/var/www/html/storage
      - ./docker.env:/var/www/html/.env
    environment:
      - DB_HOST=duvi-mysql
      - DB_PORT=3306
      - DB_DATABASE=mbg
      - DB_USERNAME=mbg_user
      - DB_PASSWORD=MbgProject2026!

volumes:
  mbg_storage:

networks:
  duvi-network:
    external: true
